name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --frozen --dev
      - name: Run tests
        run: uv run pytest
      - name: Smoke CLI
        run: |
          uv run agentprof --version
          uv run agentprof demo --dir /tmp/agentprof-ci-demo
      - name: Build package
        run: uv build
      - name: Smoke wheel install
        run: |
          python -m venv /tmp/agentprof-wheel-smoke
          /tmp/agentprof-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/agentprof-wheel-smoke/bin/agentprof demo --dir /tmp/agentprof-wheel-demo
