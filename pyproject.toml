[project]
name = "agentprof"
version = "0.1.0"
description = "Local LLM agent cost profiler to debug Langfuse traces, detect agent retry loops, and report wasted orchestration spend."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tim Donley" }]
keywords = [
    "ai-agents",
    "ai-agent-debugging",
    "agent-observability",
    "llm",
    "llm-cost-profiler",
    "observability",
    "langfuse",
    "finops",
    "cost",
    "cost-optimization",
    "agentops",
    "llmops",
    "agent-retry-loops",
    "local-agent-observability",
    "llm-agent-cost-profiler",
    "retry-loops",
    "trace-analysis",
    "tracing",
    "duckdb",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "duckdb>=1.4.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.0",
    "rich>=14.0.0",
    "typer>=0.20.0",
]

[project.urls]
Homepage = "https://github.com/tjdonley/AgentProf"
Documentation = "https://github.com/tjdonley/AgentProf#readme"
Repository = "https://github.com/tjdonley/AgentProf"
Issues = "https://github.com/tjdonley/AgentProf/issues"
Changelog = "https://github.com/tjdonley/AgentProf/blob/main/CHANGELOG.md"
"Demo Report" = "https://github.com/tjdonley/AgentProf/blob/main/examples/reports/demo.html"

[project.scripts]
agentprof = "agentprof.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["agentprof"]

[tool.hatch.build.targets.wheel.force-include]
"agentprof/demo/langfuse_multi_agent_observations.json" = "agentprof/demo/langfuse_multi_agent_observations.json"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
