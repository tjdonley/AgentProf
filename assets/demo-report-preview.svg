<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-label="AgentProf demo report preview">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1120" height="640" rx="32" fill="#f8fafc"/>
  <rect x="48" y="44" width="1024" height="552" rx="26" fill="#ffffff" stroke="#dbe3ef" filter="url(#shadow)"/>

  <rect x="80" y="76" width="960" height="148" rx="22" fill="url(#hero)"/>
  <text x="112" y="126" fill="#bfdbfe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" letter-spacing="3">AGENTPROF REPORT</text>
  <text x="112" y="174" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="800">AgentProf Demo</text>
  <text x="112" y="204" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Local trace profiler for fixable agent waste</text>

  <rect x="80" y="252" width="150" height="104" rx="16" fill="#fbfdff" stroke="#dbe3ef"/>
  <text x="104" y="286" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">ISSUES</text>
  <text x="104" y="329" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="800">4</text>

  <rect x="250" y="252" width="220" height="104" rx="16" fill="#fbfdff" stroke="#dbe3ef"/>
  <text x="274" y="286" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">WASTED SPEND</text>
  <text x="274" y="329" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="800">$0.060</text>

  <rect x="490" y="252" width="220" height="104" rx="16" fill="#fbfdff" stroke="#dbe3ef"/>
  <text x="514" y="286" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700">AFFECTED TRACES</text>
  <text x="514" y="329" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="800">2</text>

  <rect x="730" y="252" width="310" height="104" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="754" y="286" fill="#1d4ed8" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800">TOP FINDING</text>
  <text x="754" y="320" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="800">2.00x orchestration cost</text>
  <text x="754" y="344" fill="#475569" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">3 agents vs estimated baseline</text>

  <rect x="80" y="392" width="960" height="76" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
  <rect x="104" y="416" width="132" height="28" rx="14" fill="#dbeafe"/>
  <text x="122" y="436" fill="#1e40af" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800">MEDIUM</text>
  <text x="260" y="423" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800">Repeated failing call to refund_policy_lookup</text>
  <text x="260" y="449" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Same input and same missing field error retried without mutation.</text>

  <rect x="80" y="492" width="960" height="76" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
  <rect x="104" y="516" width="132" height="28" rx="14" fill="#dcfce7"/>
  <text x="122" y="536" fill="#166534" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800">ESTIMATE</text>
  <text x="260" y="523" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="21" font-weight="800">Estimated orchestration overhead in triage_agent</text>
  <text x="260" y="549" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15">Actual cost $0.084; estimated simpler baseline $0.042.</text>
</svg>
